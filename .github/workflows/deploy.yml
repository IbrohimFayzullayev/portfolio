name: Build & Deploy Public Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ibrohimfayzullayev/portfolio

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # The public site fetches the API server-side, so the API URL is the
          # internal compose address. SITE_URL is your real public domain.
          build-args: |
            NEXT_PUBLIC_API_URL=http://api:8080/api/v1
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}
            NEXT_PUBLIC_UMAMI_SRC=${{ vars.NEXT_PUBLIC_UMAMI_SRC }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/portfolio

            # Domains come from .env; source it FIRST so its TAG=latest cannot
            # clobber the pinned tag below.
            set -a; . ./.env; set +a

            # The image tag is pinned to this commit rather than `latest`, so a
            # rollback is `TAG=<previous sha> docker compose up -d web`.
            export TAG="${{ github.sha }}"
            docker compose -f docker-compose.prod.yml --env-file .env pull web
            docker compose -f docker-compose.prod.yml --env-file .env up -d web

            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null "https://$PUBLIC_DOMAIN"; then
                echo "healthy: $PUBLIC_DOMAIN"
                echo "$TAG $(date -Is)" >> deployed-web.log

                # Tell the ops bot. `|| true` because a deploy that worked must
                # not be reported as failed just because the notification did
                # not land (e.g. before migration 000004 has run).
                docker compose -f docker-compose.prod.yml exec -T db \
                  psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -q -c \
                  "INSERT INTO notifications (kind, payload) VALUES ('deploy.finished', jsonb_build_object('service', 'web', 'sha', '$TAG'));" \
                  >/dev/null 2>&1 || true

                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo "FAILED: $PUBLIC_DOMAIN did not become healthy within 60s"
            docker compose -f docker-compose.prod.yml logs --tail 50 web
            exit 1
